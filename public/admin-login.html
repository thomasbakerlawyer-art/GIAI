<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login • GIAI</title>

<link rel="stylesheet" href="style.css">

<style>
body{
    background:#050505;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:Arial,sans-serif;
}

.login-box{
    width:100%;
    max-width:420px;
    background:#111;
    padding:35px;
    border-radius:18px;
    border:1px solid rgba(240,185,11,.15);
}

.logo{
    text-align:center;
    color:#f0b90b;
    font-size:32px;
    font-weight:bold;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#888;
    margin-bottom:30px;
}

.input-group{
    margin-bottom:18px;
}

.input-group label{
    display:block;
    color:#aaa;
    margin-bottom:6px;
}

.input-group input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #222;
    background:#0b0b0b;
    color:#fff;
}

button{
    width:100%;
    padding:15px;
    background:#f0b90b;
    color:#000;
    border:none;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="login-box">

<div class="logo">GIAI</div>

<div class="subtitle">
Administrator Login
</div>

<div class="input-group">
<label>Email</label>
<input type="email" id="adminEmail">
</div>

<div class="input-group">
<label>Password</label>
<input type="password" id="adminPassword">
</div>

<button onclick="adminLogin()">
Login
</button>

</div>

<script src="admin-login.js"></script>

</body>
</html>
