
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network Assignment</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#050505;font-family:Arial,sans-serif;color:#fff;min-height:100vh;padding:32px 20px 60px;}
.container{max-width:660px;margin:0 auto;}
.header{text-align:center;margin-bottom:28px;}
.logo{font-size:1rem;font-weight:900;color:#f0b90b;letter-spacing:3px;margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:10px;}
.header-line{width:50px;height:2px;background:#f0b90b;margin:10px auto;}
.doc-title{font-size:0.7rem;color:#555;letter-spacing:2px;text-transform:uppercase;}
.lang-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:24px;}
.lang-btn{background:#111;border:1px solid rgba(240,185,11,0.2);color:#999;padding:5px 14px;border-radius:20px;font-size:0.75rem;cursor:pointer;transition:0.2s;}
.lang-btn:hover,.lang-btn.active{background:#f0b90b;color:#000;border-color:#f0b90b;font-weight:700;}
.rep-card{background:#0f0f0f;border:1px solid rgba(240,185,11,0.2);border-radius:16px;padding:22px 26px;margin-bottom:20px;display:flex;align-items:center;gap:20px;}
.rep-img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:2px solid #f0b90b;flex-shrink:0;}
.rep-name-row{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.rep-name-row h2{font-size:1.25rem;color:#fff;}
.rep-info p{color:#999;font-size:0.82rem;margin-bottom:8px;}
.rep-badge{display:inline-block;background:rgba(240,185,11,0.12);border:1px solid rgba(240,185,11,0.3);color:#f0b90b;font-size:0.68rem;font-weight:700;letter-spacing:1.5px;padding:3px 10px;border-radius:20px;text-transform:uppercase;}
.notice{background:#0f0f0f;border:1px solid rgba(240,185,11,0.2);border-left:4px solid #f0b90b;border-radius:12px;padding:20px 22px;margin-bottom:20px;font-size:0.875rem;line-height:1.75;color:#ccc;}
.notice strong{color:#f0b90b;}
.referral-box{background:#0f0f0f;border:1px solid rgba(240,185,11,0.2);border-radius:12px;padding:18px 22px;margin-bottom:20px;}
.referral-box h3{color:#f0b90b;font-size:0.88rem;margin-bottom:10px;}
.referral-box p{color:#aaa;font-size:0.82rem;line-height:1.65;margin-bottom:12px;}
.referral-link{display:flex;align-items:center;gap:10px;background:#161616;border:1px solid rgba(240,185,11,0.25);border-radius:8px;padding:11px 14px;}
.referral-link a{color:#f0b90b;font-size:0.78rem;word-break:break-all;text-decoration:none;flex:1;}
.copy-btn{background:#f0b90b;color:#000;border:none;border-radius:6px;padding:5px 12px;font-size:0.72rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.voting-note{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);border-radius:10px;padding:14px 18px;margin-bottom:20px;font-size:0.8rem;color:#666;line-height:1.6;}
.voting-note strong{color:#999;}
.section-label{font-size:0.68rem;letter-spacing:2px;text-transform:uppercase;color:#555;margin-bottom:12px;padding-left:2px;}
.country-list{background:#0f0f0f;border:1px solid rgba(240,185,11,0.15);border-radius:14px;overflow:hidden;margin-bottom:20px;}
.country-row{display:grid;grid-template-columns:26px 1fr 1fr 90px;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,0.05);}
.country-row:last-child{border-bottom:none;}
.country-row.hdr{background:rgba(240,185,11,0.05);font-size:0.65rem;text-transform:uppercase;letter-spacing:1.5px;color:#555;padding:10px 20px;}
.country-flag{font-size:1.2rem;}
.country-name{font-weight:600;font-size:0.9rem;color:#fff;}
.opener-name{color:#bbb;font-size:0.84rem;}
.votes-input{background:rgba(255,255,255,0.04);border:1px solid rgba(240,185,11,0.2);border-radius:7px;padding:6px 10px;font-size:0.85rem;color:#f0b90b;font-weight:700;text-align:center;width:100%;outline:none;}
.votes-input:focus{border-color:#f0b90b;background:rgba(240,185,11,0.07);}
.votes-input:disabled{opacity:0.4;cursor:not-allowed;background:rgba(255,255,255,0.02);color:#666;border-color:rgba(255,255,255,0.08);}
.votes-input.locked{color:#00d26a;border-color:rgba(0,210,106,0.3);background:rgba(0,210,106,0.05);opacity:1;}
.votes-input.theirs{color:#f0b90b;border-color:rgba(240,185,11,0.5);background:rgba(240,185,11,0.08);opacity:1;}.my-row{background:rgba(240,185,11,0.04);}
.confirm-btn{width:100%;padding:16px;background:#f0b90b;border:none;border-radius:12px;color:#000;font-size:1rem;font-weight:800;cursor:pointer;letter-spacing:0.5px;transition:0.2s;margin-top:6px;}
.confirm-btn:hover{opacity:0.88;transform:translateY(-1px);}
.confirm-btn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.confirm-sub{font-size:0.72rem;color:#555;margin-top:8px;text-align:center;}
.confirmed-msg{display:none;background:rgba(0,210,106,0.1);border:1px solid rgba(0,210,106,0.3);border-radius:10px;padding:14px;color:#00d26a;font-size:0.88rem;font-weight:600;margin-top:12px;text-align:center;}
.loading{text-align:center;color:#555;padding:40px;font-size:0.9rem;}
@media(max-width:480px){.country-row{grid-template-columns:22px 1fr 1fr 70px;gap:8px;padding:12px 14px;}.rep-name-row{justify-content:center;}.lang-btn{font-size:0.7rem;padding:4px 10px;}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div class="logo">
      <svg width="26" height="26" viewBox="0 0 126.61 126.61" xmlns="http://www.w3.org/2000/svg"><g fill="#f0b90b"><path d="M38.73 53.2L63.3 28.63l24.59 24.59 14.3-14.3L63.3 0 24.43 38.9z"/><path d="M0 63.31l14.3-14.31 14.31 14.31-14.31 14.3z"/><path d="M38.73 73.41L63.3 98l24.59-24.57 14.31 14.29-38.9 38.9-38.9-38.88z"/><path d="M98 63.31l14.3-14.31 14.31 14.3-14.31 14.32z"/><path d="M77.83 63.3L63.3 48.78 52.59 59.49l-1.27 1.27-2.6 2.6 14.58 14.57 14.54-14.54-.01-.09z"/></g></svg>
      <span>BINANCE &middot; GIAI</span>
    </div>
    <div class="header-line"></div>
    <div class="doc-title" id="docTitleEl">Global Investor Acquisition Initiative &mdash; Official Assignment</div>
  </div>

  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('en',this)">&#127468;&#127463; English</button>
    <button class="lang-btn" onclick="setLang('ar',this)">&#127462;&#127466; Arabic</button>
    <button class="lang-btn" onclick="setLang('fr',this)">&#127467;&#127479; French</button>
    <button class="lang-btn" onclick="setLang('no',this)">&#127475;&#127476; Norwegian</button>
    <button class="lang-btn" onclick="setLang('de',this)">&#127465;&#127466; German</button>
  </div>

  <div id="pageContent" class="loading">Loading...</div>
</div>

<script>
var PERSONS = {
  "ahmed-jb":         {name:"Ahmed JB",         country:"Tunisia", flag:"&#127481;&#127475;"},
  "islam-essam":      {name:"Islam Essam",       country:"Egypt",   flag:"&#127466;&#127468;"},
  "cato-beo":         {name:"Cato Beo",          country:"Norway",  flag:"&#127475;&#127476;"},
  "sophie-schneider": {name:"Sophie Schneider",  country:"Germany", flag:"&#127465;&#127466;"},
  "louis-theo":       {name:"Louis Theo",        country:"France",  flag:"&#127467;&#127479;"}
};

var ALL_OPENERS = [
  {id:"ahmed-jb",         name:"Ahmed JB",         country:"Tunisia", flag:"&#127481;&#127475;"},
  {id:"islam-essam",      name:"Islam Essam",       country:"Egypt",   flag:"&#127466;&#127468;"},
  {id:"cato-beo",         name:"Cato Beo",          country:"Norway",  flag:"&#127475;&#127476;"},
  {id:"sophie-schneider", name:"Sophie Schneider",  country:"Germany", flag:"&#127465;&#127466;"},
  {id:"louis-theo",       name:"Louis Theo",        country:"France",  flag:"&#127467;&#127479;"}
];

var T = {
  en: {
    verified:"Verified Representative", division:"North African Investment Division",
    noticeTitle:"We have accepted and assigned",
    notice:"your designated country openers for the upcoming GIAI voting platform launch. The platform goes live <strong>in a matter of hours</strong> - you and your team should stay ready. Please submit all required documents as soon as possible.",
    refTitle:"Your Binance Referral Link",
    refDesc:"Share this link with your network. Get at least <strong>100 people</strong> to sign up - every sign-up counts toward your credits.",
    copy:"Copy", copied:"Copied!",
    votingNote:"<strong>GIAI Voting Platform Link</strong> - A special referral link will be issued once the system goes live.",
    sectionLabel:"Assigned Country Openers",
    country:"Country", opener:"Opener", votes:"Votes",
    confirmBtn:"Lock In & Confirm Votes",
    confirmSub:"By confirming, you are locking in your vote count.",
    confirmedMsg:"Votes confirmed and locked in. Thank you,",
  },
  ar: {
    verified:"ممثل معتمد", division:"قسم الاستثمار في شمال أفريقيا",
    noticeTitle:"لقد قبلنا وعيّنا",
    notice:"فاتحي التصويت. ستنطلق المنصة <strong>في غضون ساعات</strong>.",
    refTitle:"رابط إحالة Binance",
    refDesc:"شارك هذا الرابط. احصل على <strong>100 شخص</strong> للتسجيل.",
    copy:"نسخ", copied:"تم!",
    votingNote:"<strong>GIAI</strong> - سيتم إصدار رابط خاص لاحقا.",
    sectionLabel:"فاتحو التصويت",
    country:"البلد", opener:"الفاتح", votes:"الأصوات",
    confirmBtn:"تأكيد وتثبيت",
    confirmSub:"بالتأكيد، تقوم بتثبيت عدد أصواتك.",
    confirmedMsg:"تم التأكيد.",
  },
  fr: {
    verified:"Representant Verifie", division:"Division Investissement Nord-Africain",
    noticeTitle:"Nous avons accepte et assigne",
    notice:"vos ouvreurs de pays pour le lancement GIAI. La plateforme sera lancee <strong>dans quelques heures</strong> - restez prets.",
    refTitle:"Votre Lien de Parrainage Binance",
    refDesc:"Partagez ce lien. Obtenez au moins <strong>100 personnes</strong> - chaque inscription compte.",
    copy:"Copier", copied:"Copie!",
    votingNote:"<strong>GIAI</strong> - Un lien special sera emis une fois le systeme en ligne.",
    sectionLabel:"Ouvreurs de Pays Assignes",
    country:"Pays", opener:"Ouvreur", votes:"Votes",
    confirmBtn:"Verrouiller et Confirmer",
    confirmSub:"En confirmant, vous verrouillez votre nombre de votes.",
    confirmedMsg:"Votes confirmes. Merci,",
  },
  no: {
    verified:"Verifisert Representant", division:"Nord-Afrikansk Investeringsavdeling",
    noticeTitle:"Vi har godtatt og tildelt",
    notice:"dine utpekte landsapnere. Plattformen gar live <strong>i lopet av timer</strong> - dere bor vare klare.",
    refTitle:"Din Binance Henvisningslenke",
    refDesc:"Del denne lenken. Fa minst <strong>100 personer</strong> til a registrere seg.",
    copy:"Kopier", copied:"Kopiert!",
    votingNote:"<strong>GIAI</strong> - En spesiell lenke vil bli utstedt nar systemet er live.",
    sectionLabel:"Tildelte Landsapnere",
    country:"Land", opener:"Apner", votes:"Stemmer",
    confirmBtn:"Las Inn og Bekreft",
    confirmSub:"Ved a bekrefte laser du inn ditt stemmeantall.",
    confirmedMsg:"Stemmer bekreftet. Takk,",
  },
  de: {
    verified:"Verifizierter Vertreter", division:"Nordafrikanische Investitionsabteilung",
    noticeTitle:"Wir haben akzeptiert und zugewiesen",
    notice:"Ihre Landeroeffner fuer den Start der GIAI-Plattform. Die Plattform geht <strong>in wenigen Stunden</strong> live.",
    refTitle:"Ihr Binance-Empfehlungslink",
    refDesc:"Teilen Sie diesen Link. Bringen Sie mindestens <strong>100 Personen</strong> zur Anmeldung.",
    copy:"Kopieren", copied:"Kopiert!",
    votingNote:"<strong>GIAI</strong> - Ein spezieller Link wird ausgegeben sobald das System live ist.",
    sectionLabel:"Zugewiesene Landeroeffner",
    country:"Land", opener:"Oeffner", votes:"Stimmen",
    confirmBtn:"Einschliessen und Bestaetigen",
    confirmSub:"Mit der Bestaetigung sperren Sie Ihre Stimmenzahl.",
    confirmedMsg:"Stimmen bestaetigt. Danke,",
  }
};

var REP_IMG = "/img/IMG_robertrachel.PNG";
var BINANCE_LINK = "https://play.google.com/store/apps/details?id=com.binance.dev&pcampaignid=web_share";
var currentLang = "en";
var personId = null;
var allVotes = {};
var isLocked = false;

function init() {
  var parts = window.location.pathname.split("/");
  personId = parts[parts.length - 1];
  if (!PERSONS[personId]) {
    document.getElementById("pageContent").innerHTML = "<p style='color:#f44;text-align:center;padding:40px;'>Invalid link.</p>";
    return;
  }
  fetch("/network-votes/" + personId)
    .then(function(r){ return r.json(); })
    .then(function(data){
      allVotes = data.votes || {};
      isLocked = data.locked || false;
      render();
    })
    .catch(function(){ render(); });
}

function render() {
  var t = T[currentLang];
  var isRTL = currentLang === "ar";
  document.documentElement.dir = isRTL ? "rtl" : "ltr";

  var rows = ALL_OPENERS.map(function(p) {
    var isMe = p.id === personId;
    var voteVal = allVotes[p.id] !== undefined ? allVotes[p.id] : "";
    var locked = true; var editable = isMe && !isLocked;
    return '<div class="country-row' + (isMe ? " my-row" : "") + '">'
      + '<span class="country-flag">' + p.flag + '</span>'
      + '<span class="country-name">' + p.country + '</span>'
      + '<span class="opener-name">' + p.name + (isMe ? ' <span style="color:#f0b90b;font-size:0.7rem;">(you)</span>' : "") + '</span>'
      + '<input class="votes-input' + (voteVal !== "" ? (isMe ? " locked" : " theirs") : "") + '" type="number" min="0" value="' + voteVal + '" id="vote-' + p.id + '" ' + (locked ? "disabled" : "") + '>'
      + '</div>';
  }).join("");

  var confirmSection = isLocked
    ? '<div class="confirmed-msg" style="display:block;">' + t.confirmedMsg + ' ' + PERSONS[personId].name + '.</div>'
    : '<button class="confirm-btn" onclick="confirmVotes()">' + t.confirmBtn + '</button>'
      + '<div class="confirm-sub">' + t.confirmSub + '</div>'
      + '<div class="confirmed-msg" id="confirmedMsg"></div>';

  document.getElementById("pageContent").innerHTML =
    '<div class="rep-card">'
      + '<img src="' + REP_IMG + '" class="rep-img" alt="Robert Rachel">'
      + '<div class="rep-info">'
        + '<div class="rep-name-row"><h2>Robert Rachel</h2>'
          + '<svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 2L13.8 5.2L17.4 4.1L17.5 7.9L21 9.5L19 12.8L21 16.1L17.5 17.7L17.4 21.5L13.8 20.4L12 23.6L10.2 20.4L6.6 21.5L6.5 17.7L3 16.1L5 12.8L3 9.5L6.5 7.9L6.6 4.1L10.2 5.2Z" fill="#1D9BF0"/><path d="M8 12.5L10.8 15.5L16.5 9" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        + '</div>'
        + '<p>' + t.division + '</p>'
        + '<span class="rep-badge">' + t.verified + '</span>'
      + '</div>'
    + '</div>'
    + '<div class="notice"><strong>' + t.noticeTitle + '</strong> ' + t.notice + '</div>'
    + '<div class="referral-box">'
      + '<h3>' + t.refTitle + '</h3>'
      + '<p>' + t.refDesc + '</p>'
      + '<div class="referral-link"><a href="' + BINANCE_LINK + '" target="_blank">' + BINANCE_LINK + '</a><button class="copy-btn" onclick="copyLink()">' + t.copy + '</button></div>'
    + '</div>'
    + '<div class="voting-note">' + t.votingNote + '</div>'
    + '<div class="section-label">' + t.sectionLabel + '</div>'
    + '<div class="country-list">'
      + '<div class="country-row hdr"><span></span><span>' + t.country + '</span><span>' + t.opener + '</span><span>' + t.votes + '</span></div>'
      + rows
    + '</div>'
    + '<div class="confirm-section">' + confirmSection + '</div>';
}

function setLang(lang, btn) {
  currentLang = lang;
  document.querySelectorAll(".lang-btn").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  render();
}

function copyLink() {
  navigator.clipboard.writeText(BINANCE_LINK).then(function(){
    var btn = document.querySelector(".copy-btn");
    var t = T[currentLang];
    btn.innerText = t.copied;
    setTimeout(function(){ btn.innerText = t.copy; }, 2000);
  });
}

function confirmVotes() {
  var myInput = document.getElementById("vote-" + personId);
  var votes = myInput ? parseInt(myInput.value) || 0 : 0;if(!confirm("Lock in " + votes + " votes? You will not be able to change this afterwards.")) return;
  fetch("/network-votes/" + personId, {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({votes:votes})
  }).then(function(){
    isLocked = true;
    allVotes[personId] = votes;
    render();
  }).catch(function(){ alert("Something went wrong. Please try again."); });
}

init();
</script>
</body>
</html>
